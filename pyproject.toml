[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-manual-generator"
version = "0.1.0"
description = "Browser automation tool with manual generation - supports recording, AI execution, and automatic documentation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
keywords = ["playwright", "automation", "manual", "documentation", "screenshot", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "playwright>=1.40.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
    "python-slugify>=8.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0.0",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "web-manual-generator[ai,dev]",
]

[project.scripts]
web-manual = "web_manual_generator.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/web-manual-generator"
Documentation = "https://github.com/your-username/web-manual-generator#readme"
Repository = "https://github.com/your-username/web-manual-generator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
